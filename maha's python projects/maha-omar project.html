<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Memory Game</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
<style>
  :root {
    --bg-color: #1a202c;
    --text-color: #e2e8f0;
    --card-back-color: #63b3ed;
    --card-front-color: #4a5568;
  }
  body {
    background-color: var(--bg-color);
    color: var(--text-color);
    font-family: 'Tajawal', 'Inter', sans-serif;
    margin: 0; padding: 16px;
    transition: background-color 0.3s, color 0.3s;
  }
  .page {
    max-width: 700px;
    margin: auto;
    background-color: var(--card-front-color);
    border-radius: 16px;
    box-shadow: 0 10px 15px rgba(0,0,0,0.3);
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    transition: background-color 0.3s;
  }
  .hidden { display: none; }
  .game-board {
    display: grid;
    gap: 10px;
    width: 100%;
    max-width: 600px;
    margin-bottom: 20px;
  }
  .game-board.cols-4 { grid-template-columns: repeat(4, 1fr); }
  .game-board.cols-5 { grid-template-columns: repeat(5, 1fr); }
  .game-board.cols-6 { grid-template-columns: repeat(6, 1fr); }
  .card {
    width: 100%;
    padding-bottom: 100%;
    position: relative;
    perspective: 1000px;
    cursor: pointer;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
  }
  .card-inner {
    position: absolute;
    width: 100%; height: 100%;
    text-align: center;
    border-radius: 8px;
    transition: transform 0.6s;
    transform-style: preserve-3d;
  }
  .card.flipped .card-inner { transform: rotateY(180deg); }
  .card-front, .card-back {
    position: absolute; width: 100%; height: 100%;
    backface-visibility: hidden;
    border-radius: 8px;
    display: flex; justify-content: center; align-items: center;
    font-size: 2.5em;
    color: var(--text-color);
  }
  .card-front { background-color: var(--card-front-color); transform: rotateY(180deg); }
  .card-back { background-color: var(--card-back-color); color: #1a202c; }
  .card.matched { opacity: 0.5; pointer-events: none; transform: scale(0.9); transition: opacity 0.6s, transform 0.6s; }
  .message-box {
    background-color: var(--card-front-color);
    color: var(--text-color);
    padding: 10px 15px;
    border-radius: 8px;
    margin-top: 10px;
    font-weight: bold;
    text-align: center;
    min-height: 40px;
    display: flex; align-items: center; justify-content: center;
  }
  .game-button {
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.3s, transform 0.2s;
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    background: #4CAF50;
    color: white;
    border: none;
  }
  .game-button:hover { background: #45a049; transform: translateY(-2px); }
  .reset-button { background: #e53e3e; }
  .reset-button:hover { background: #c53030; }
  .score-display {
    font-size: 1.2em;
    font-weight: bold;
    color: var(--text-color);
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .form-group {
    margin-bottom: 15px;
    width: 100%;
    max-width: 300px;
  }
  .form-group label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
  }
  .form-group select, .form-group input {
    width: 100%;
    padding: 8px;
    border-radius: 4px;
    border: 1px solid #4a5568;
    background: #2d3748;
    color: var(--text-color);
  }
  .form-group input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 8px;
    background: #4a5568;
    outline: none;
    opacity: 0.7;
    transition: opacity .2s;
    border-radius: 5px;
  }
  .form-group input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #63b3ed;
    cursor: pointer;
  }
  .form-group input[type="range"]::-moz-range-thumb {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #63b3ed;
    cursor: pointer;
  }
  /* Player colors for two players mode */
  .player1-bg { background-color: #e3f0ff !important; color: #1a202c !important; }
  .player2-bg { background-color: #eaffea !important; color: #1a202c !important; }
  /* Themes (20+) */
  .theme-0 { --bg-color: #1a202c; --text-color: #e2e8f0; --card-back-color: #63b3ed; --card-front-color: #4a5568; }
  .theme-1 { --bg-color: #ffecd2; --text-color: #5b4636; --card-back-color: #fcb69f; --card-front-color: #f6ae2d; }
  .theme-2 { --bg-color: #034f84; --text-color: #ffffff; --card-back-color: #92a8d1; --card-front-color: #f7cac9; }
  .theme-3 { --bg-color: #2f5233; --text-color: #d9ead3; --card-back-color: #6aa84f; --card-front-color: #38761d; }
  .theme-4 { --bg-color: #e6e6fa; --text-color: #4b0082; --card-back-color: #c8a2c8; --card-front-color: #9370db; }
  .theme-5 { --bg-color: #ffb6b9; --text-color: #6a0572; --card-back-color: #fcd5ce; --card-front-color: #f8a5c2; }
  .theme-6 { --bg-color: #d0f0c0; --text-color: #2f4f4f; --card-back-color: #a8dadc; --card-front-color: #457b9d; }
  .theme-7 { --bg-color: #ffe5b4; --text-color: #5c4033; --card-back-color: #ffccbc; --card-front-color: #ffab91; }
  .theme-8 { --bg-color: #0b132b; --text-color: #ffffff; --card-back-color: #1c2541; --card-front-color: #3a506b; }
  .theme-9 { --bg-color: #ffc1cc; --text-color: #800020; --card-back-color: #ffb6b9; --card-front-color: #ff6f91; }
  .theme-10 { --bg-color: #87ceeb; --text-color: #003366; --card-back-color: #b0e0e6; --card-front-color: #4682b4; }
  .theme-11 { --bg-color: #fff8dc; --text-color: #b8860b; --card-back-color: #ffd700; --card-front-color: #daa520; }
  .theme-12 { --bg-color: #ff7f50; --text-color: #4b2e83; --card-back-color: #ff6f61; --card-front-color: #e76f51; }
  .theme-13 { --bg-color: #708090; --text-color: #f0f8ff; --card-back-color: #778899; --card-front-color: #2f4f4f; }
  .theme-14 { --bg-color: #004953; --text-color: #a7c5bd; --card-back-color: #2a9d8f; --card-front-color: #264653; }
  .theme-15 { --bg-color: #ffefd5; --text-color: #556b2f; --card-back-color: #98fb98; --card-front-color: #2e8b57; }
  .theme-16 { --bg-color: #800020; --text-color: #ffe4e1; --card-back-color: #c71585; --card-front-color: #db7093; }
  .theme-17 { --bg-color: #e0ffff; --text-color: #4682b4; --card-back-color: #afeeee; --card-front-color: #5f9ea0; }
  .theme-18 { --bg-color: #fffacd; --text-color: #b8860b; --card-back-color: #ffeb3b; --card-front-color: #fbc02d; }
  .theme-19 { --bg-color: #36454f; --text-color: #dcdcdc; --card-back-color: #4f5b66; --card-front-color: #2f4f4f; }
  @media (max-width: 480px) {
    .game-board { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .card-inner { font-size: 1.8em; }
  }
  @media (max-width: 380px) {
    .game-board { grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .card-inner { font-size: 1.5em; }
  }
</style>
</head>
<body class="theme-0">
  <div id="mainMenu" class="page">
    <h1 id="mainTitle" class="text-3xl font-bold mb-4">Memory Game</h1>
    <button id="startGameButton" class="game-button">Start Game</button>
    <button id="settingsButton" class="game-button">Settings</button>
  </div>

  <div id="settingsPage" class="page hidden">
    <h1 id="settingsTitle" class="text-3xl font-bold mb-4">Settings</h1>
    <div class="form-group">
      <label for="langSelect" id="langLabel">Language:</label>
      <select id="langSelect">
        <option value="en">English</option>
        <option value="ar">العربية</option>
      </select>
    </div>
    <div class="form-group">
      <label for="gameMode" id="gameModeLabel">Game Mode:</label>
      <select id="gameMode">
        <option value="playerVsPlayer">Two Players</option>
        <option value="playerVsComputer">Player vs Computer</option>
      </select>
    </div>
    <div class="form-group" id="computerDifficultyGroup">
      <label for="computerDifficulty" id="compDiffLabel">Computer Difficulty:</label>
      <select id="computerDifficulty">
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
      </select>
    </div>
    <div class="form-group" id="playerNamesGroup">
      <label for="player1Name" id="player1NameLabel">Player 1 Name:</label>
      <input type="text" id="player1Name" placeholder="Player 1" />
    </div>
    <div class="form-group" id="player2NameGroup">
      <label for="player2Name" id="player2NameLabel">Player 2 Name:</label>
      <input type="text" id="player2Name" placeholder="Player 2" />
    </div>
    <div class="form-group">
      <label for="initialRevealTime" id="revealTimeLabel">Initial Reveal Time (seconds): <span id="revealTimeValue">3</span></label>
      <input type="range" id="initialRevealTime" min="0" max="10" value="3" step="1" />
    </div>
    <div class="form-group">
      <label for="themeSelect" id="themeLabel">Theme:</label>
      <select id="themeSelect"></select>
    </div>
    <div class="form-group">
      <label for="boardSize" id="boardSizeLabel">Board Size:</label>
      <select id="boardSize">
        <option value="4x4">4x4 (16 cards)</option>
        <option value="4x5">4x5 (20 cards)</option>
        <option value="4x6">4x6 (24 cards)</option>
        <option value="6x6">6x6 (36 cards)</option>
      </select>
    </div>
    <button id="saveSettingsButton" class="game-button">Save & Back</button>
  </div>

  <div id="gamePage" class="page hidden">
    <h1 id="gameTitle" class="text-3xl font-bold mb-4">Memory Game</h1>
    <div class="score-display">
      <span id="playerTurnDisplay"></span>
      <span id="score1Box">Player 1: <span id="score1">0</span></span>
      <span id="score2Box" style="display:none;">Player 2: <span id="score2">0</span></span>
      <span id="movesBox">Moves: <span id="moves">0</span></span>
    </div>
    <div class="game-board" id="gameBoard"></div>
    <div class="message-box" id="messageBox">Click any card to start!</div>
    <button id="backToMenuButton" class="game-button reset-button">Back to Menu</button>
  </div>

  const gameBoard = document.getElementById('gameBoard');

  const settingsTitle = document.getElementById('settingsTitle');

  const langLabel = document.getElementById('langLabel');
  const gameModeLabel = document.getElementById('gameModeLabel');
  const compDiffLabel = document.getElementById('compDiffLabel');
  const revealTimeLabel = document.getElementById('revealTimeLabel');
  const boardSizeLabel = document.getElementById('boardSizeLabel');
  const player1NameLabel = document.getElementById('player1NameLabel');
  const player2NameLabel = document.getElementById('player2NameLabel');
  const themeLabel = document.getElementById('themeLabel');

  // Themes array for select options

  // Fill theme select options

  // Functions

    mainMenu.classList.add('hidden');

  function updateLanguageTexts() {
    mainTitle.textContent = translations[lang].mainTitle;
    startGameButton.textContent = translations[lang].startGame;
    settingsButton.textContent = translations[lang].settings;
    settingsTitle.textContent = translations[lang].settingsTitle;

    boardSizeSelect.options[0].textContent = lang === 'ar' ? "4x4 (16 كارت)" : "4x4 (16 cards)";
    boardSizeSelect.options[1].textContent = lang === 'ar' ? "4x5 (20 كارت)" : "4x5 (20 cards)";
    boardSizeSelect.options[2].textContent = lang === 'ar' ? "4x6 (24 كارت)" : "4x6 (24 cards)";
    boardSizeSelect.options[3].textContent = lang === 'ar' ? "6x6 (36 كارت)" : "6x6 (36 cards)";
  }

  function applyTheme(index) {
    const theme = themes[index];
    for (const varName in theme.vars) {
      document.documentElement.style.setProperty(varName, theme.vars[varName]);
    }
    document.body.className = `theme-${index}`;
  }

  function updateGameDisplays() {
    movesDisplay.textContent = totalMoves;
    score1Display.textContent = scores[0];
    score2Display.textContent = scores[1];
    if (gameSettings.gameMode === 'playerVsPlayer') {
      score1Box.innerHTML = `${playerNames[0]}: <span id="score1">${scores[0]}</span>`;
      score2Box.innerHTML = `${playerNames[1]}: <span id="score2">${scores[1]}</span>`;
      score2Box.style.display = '';
      playerTurnDisplay.textContent = `${playerNames[currentPlayer - 1]} ${translations[lang].turn}`;
      // Update background color for current player
      gamePage.classList.remove('player1-bg', 'player2-bg');
      gamePage.classList.add(currentPlayer === 1 ? 'player1-bg' : 'player2-bg');
    } else {
      score1Box.innerHTML = `${playerNames[0]}: <span id="score1">${scores[0]}</span>`;
      score2Box.innerHTML = `${translations[lang].computer}: <span id="score2">${scores[1]}</span>`;
      score2Box.style.display = '';
      playerTurnDisplay.textContent = currentPlayer === 1 ? translations[lang].yourTurn : translations[lang].compTurn;
      gamePage.classList.remove('player1-bg', 'player2-bg');
    }
  }

  function displayMessage(message) {
    messageBox.textContent = message;
  }

  function initializeGame() {
    gameBoard.innerHTML = '';
    cards = [];
    flippedCards = [];
    matchedPairs = 0;
    totalMoves = 0;
    lockBoard = false;
    currentPlayer = 1;
    scores = [0, 0];
    computerMemory.clear();

    updateGameDisplays();
    displayMessage(lang === 'ar' ? "اللعبة بدأت!" : "Game started!");

    const [rows, cols] = gameSettings.boardSize.split('x').map(Number);
    gameSettings.boardRows = rows;
    gameSettings.boardCols = cols;
    gameSettings.totalCards = rows * cols;

    gameBoard.className = `game-board cols-${gameSettings.boardCols}`;

    let numUniqueIcons = gameSettings.totalCards / 2;
    let availableIcons = allCardIcons.slice(0, numUniqueIcons);

    if (availableIcons.length < numUniqueIcons) {
      displayMessage(lang === 'ar' ? "عدد الأيقونات غير كافي لهذا الحجم." : "Not enough icons for this board size.");
      return;
    }

    let gameCards = [...availableIcons, ...availableIcons];
    gameCards = shuffleArray(gameCards);

    gameCards.forEach((icon, index) => {
      const cardElement = document.createElement('div');
      cardElement.classList.add('card');
      cardElement.dataset.icon = icon;
      cardElement.dataset.index = index;
      cardElement.innerHTML = `
        <div class="card-inner">
          <div class="card-front"><i class="fas ${icon}"></i></div>
          <div class="card-back"><i class="fas fa-question"></i></div>
        </div>
      `;
      cardElement.addEventListener('click', () => handleCardClick(cardElement));
      gameBoard.appendChild(cardElement);

      cards.push({
        element: cardElement,
        icon: icon,
        isFlipped: false,
        isMatched: false
      });
    });

    initialReveal();
  }

  function initialReveal() {
    lockBoard = true;
    displayMessage(
      translations[lang].memorize +
      gameSettings.initialRevealTime +
      (lang === 'ar' ? translations.ar.seconds : translations.en.seconds)
    );
    cards.forEach(card => card.element.classList.add('flipped'));
    setTimeout(() => {
      cards.forEach(card => card.element.classList.remove('flipped'));
      lockBoard = false;
      displayMessage(translations[lang].goFind);
      if (gameSettings.gameMode === 'playerVsComputer' && currentPlayer === 2) {
        setTimeout(computerTurn, 1000);
      }
    }, gameSettings.initialRevealTime * 1000);
  }

  function handleCardClick(clickedCardElement) {
    if (lockBoard) return;
    if (gameSettings.gameMode === 'playerVsComputer' && currentPlayer === 2) return;
    const cardIndex = parseInt(clickedCardElement.dataset.index);
    flipCard(cardIndex);
  }

  function flipCard(index) {
    const currentCard = cards[index];
    if (currentCard.isFlipped || currentCard.isMatched) return;

    currentCard.element.classList.add('flipped');
    currentCard.isFlipped = true;
    flippedCards.push(currentCard);

    if (gameSettings.gameMode === 'playerVsComputer' && currentPlayer === 2) {
      rememberCard(currentCard.icon, index);
    }

    if (flippedCards.length === 2) {
      totalMoves++;
      updateGameDisplays();
      lockBoard = true;
      setTimeout(() => {
        checkMatch();
      }, 900);
    }
  }

  function checkMatch() {
    const [card1, card2] = flippedCards;
    if (card1.icon === card2.icon) {
      card1.isMatched = true;
      card2.isMatched = true;
      card1.element.classList.add('matched');
      card2.element.classList.add('matched');
      matchedPairs++;
      if (currentPlayer === 1) scores[0]++;
      else scores[1]++;
      updateGameDisplays();
      displayMessage(translations[lang].match);
      if (gameSettings.gameMode === 'playerVsComputer' && currentPlayer === 2) {
        computerMemory.delete(card1.icon);
      }
      if (matchedPairs === gameSettings.totalCards / 2) {
        let winnerMsg = '';
        if (scores[0] > scores[1]) winnerMsg = translations[lang].win + (gameSettings.gameMode === 'playerVsPlayer' ? playerNames[0] : playerNames[0]);
        else if (scores[1] > scores[0]) winnerMsg = translations[lang].win + (gameSettings.gameMode === 'playerVsPlayer' ? playerNames[1] : translations[lang].computer);
        else winnerMsg = translations[lang].draw;
        displayMessage(winnerMsg);
        lockBoard = true;
        currentPlayer = 0;
      } else {
        lockBoard = false;
        flippedCards = [];
        if (gameSettings.gameMode === 'playerVsComputer' && currentPlayer === 2) {
          setTimeout(computerTurn, 1000);
        }
      }
    } else {
      setTimeout(() => {
        card1.isFlipped = false;
        card2.isFlipped = false;
        card1.element.classList.remove('flipped');
        card2.element.classList.remove('flipped');
        displayMessage(translations[lang].notMatch);
        switchTurn();
        lockBoard = false;
        flippedCards = [];
      }, 600);
    }
    updateGameDisplays();
  }

  function switchTurn() {
    if (gameSettings.gameMode === 'playerVsPlayer') {
      currentPlayer = currentPlayer === 1 ? 2 : 1;
      updateGameDisplays();
    } else if (gameSettings.gameMode === 'playerVsComputer') {
      currentPlayer = currentPlayer === 1 ? 2 : 1;
      updateGameDisplays();
      if (currentPlayer === 2) {
        lockBoard = true;
        setTimeout(computerTurn, 1200);
      }
    }
  }

  async function computerTurn() {
    if (matchedPairs === gameSettings.totalCards / 2) return;
    let firstCardIndex = -1, secondCardIndex = -1;
    const availableCardIndices = cards
      .map((card, idx) => ({ card, idx }))
      .filter(item => !item.card.isFlipped && !item.card.isMatched)
      .map(item => item.idx);

    if (availableCardIndices.length === 0) return;

    if (gameSettings.computerDifficulty === 'easy') {
      firstCardIndex = availableCardIndices[Math.floor(Math.random() * availableCardIndices.length)];
      await new Promise(res => setTimeout(res, 700));
      flipCard(firstCardIndex);
      const remainingAvailable = availableCardIndices.filter(idx => idx !== firstCardIndex);
      if (remainingAvailable.length > 0) {
        secondCardIndex = remainingAvailable[Math.floor(Math.random() * remainingAvailable.length)];
        await new Promise(res => setTimeout(res, 700));
        flipCard(secondCardIndex);
      }
    } else if (gameSettings.computerDifficulty === 'medium') {
      let foundMatch = false;
      for (const [icon, indices] of computerMemory.entries()) {
        const validIndices = indices.filter(idx => !cards[idx].isMatched);
        if (validIndices.length === 2) {
          firstCardIndex = validIndices[0];
          secondCardIndex = validIndices[1];
          foundMatch = true;
          break;
        }
      }
      if (foundMatch) {
        await new Promise(res => setTimeout(res, 700));
        flipCard(firstCardIndex);
        await new Promise(res => setTimeout(res, 700));
        flipCard(secondCardIndex);
      } else {
        firstCardIndex = availableCardIndices[Math.floor(Math.random() * availableCardIndices.length)];
        await new Promise(res => setTimeout(res, 700));
        flipCard(firstCardIndex);
        const firstFlippedCard = cards[firstCardIndex];
        let potentialSecondCardIndex = -1;
        if (computerMemory.has(firstFlippedCard.icon)) {
          const knownIndices = computerMemory.get(firstFlippedCard.icon);
          potentialSecondCardIndex = knownIndices.find(idx => idx !== firstCardIndex && !cards[idx].isMatched);
        }
        if (potentialSecondCardIndex !== undefined && potentialSecondCardIndex !== -1) {
          secondCardIndex = potentialSecondCardIndex;
        } else {
          const remainingAvailable = availableCardIndices.filter(idx => idx !== firstCardIndex);
          if (remainingAvailable.length > 0) {
            secondCardIndex = remainingAvailable[Math.floor(Math.random() * remainingAvailable.length)];
          }
        }
        if (secondCardIndex !== -1) {
          await new Promise(res => setTimeout(res, 700));
          flipCard(secondCardIndex);
        }
      }
    }
  }

  function rememberCard(icon, index) {
    if (!computerMemory.has(icon)) {
      computerMemory.set(icon, []);
    }
    const indices = computerMemory.get(icon);
    if (!indices.includes(index)) {
      indices.push(index);
    }
  }

  // Event Listeners
  startGameButton.addEventListener('click', () => {
    showPage(gamePage);
    initializeGame();
  });

  settingsButton.addEventListener('click', () => {
    showPage(settingsPage);
    gameModeSelect.value = gameSettings.gameMode;
    computerDifficultySelect.value = gameSettings.computerDifficulty;
    initialRevealTimeInput.value = gameSettings.initialRevealTime;
    revealTimeValueSpan.textContent = gameSettings.initialRevealTime;
    boardSizeSelect.value = gameSettings.boardSize;
    langSelect.value = lang;
    themeSelect.value = gameSettings.themeIndex;
    player1NameInput.value = playerNames[0];
    player2NameInput.value = playerNames[1];
    if (gameSettings.gameMode === 'playerVsComputer') {
      computerDifficultyGroup.classList.remove('hidden');
      player2NameGroup.style.display = 'none';
    } else {
      computerDifficultyGroup.classList.add('hidden');
      player2NameGroup.style.display = '';
    }
    updateLanguageTexts();
  });

  saveSettingsButton.addEventListener('click', () => {
    gameSettings.gameMode = gameModeSelect.value;
    gameSettings.computerDifficulty = computerDifficultySelect.value;
    gameSettings.initialRevealTime = parseInt(initialRevealTimeInput.value);
    const [rows, cols] = boardSizeSelect.value.split('x').map(Number);
    gameSettings.boardRows = rows;
    gameSettings.boardCols = cols;
    gameSettings.totalCards = rows * cols;
    gameSettings.boardSize = boardSizeSelect.value;
    lang = langSelect.value;
    gameSettings.themeIndex = parseInt(themeSelect.value);
    playerNames[0] = player1NameInput.value.trim() || (lang === 'ar' ? 'اللاعب ١' : 'Player 1');
    playerNames[1] = player2NameInput.value.trim() || (lang === 'ar' ? 'اللاعب ٢' : 'Player 2');
    updateLanguageTexts();
    applyTheme(gameSettings.themeIndex);
    showPage(mainMenu);
  });

  gameModeSelect.addEventListener('change', () => {
    if (gameModeSelect.value === 'playerVsComputer') {
      computerDifficultyGroup.classList.remove('hidden');
      player2NameGroup.style.display = 'none';
    } else {
      computerDifficultyGroup.classList.add('hidden');
      player2NameGroup.style.display = '';
    }
  });

  initialRevealTimeInput.addEventListener('input', () => {
    revealTimeValueSpan.textContent = initialRevealTimeInput.value;
  });

  langSelect.addEventListener('change', () => {
    lang = langSelect.value;
    updateLanguageTexts();
  });

  themeSelect.addEventListener('change', () => {
    applyTheme(parseInt(themeSelect.value));
  });

  backToMenuButton.addEventListener('click', () => {
    lockBoard = true;
    showPage(mainMenu);
  });

  window.onload = () => {
    showPage(mainMenu);
    revealTimeValueSpan.textContent = initialRevealTimeInput.value;
    updateLanguageTexts();
    applyTheme(gameSettings.themeIndex);
  };

  // Utility
  function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }
</script>
