<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>maha calculator</title>
    <link href="./style.css" rel="stylesheet" />
  </head>
  <body>
    <h1 class="item h1">Maha Calculator</h1>
    <div class="item shape"></div>
    <div class="allButtons">
      <button class="reset o item" id="reset">reset</button>

      <button class="equal o item" id="=">=</button>
      <button class="add o item" id="+">+</button>
      <button class="mines o item" id="-">-</button>
      <button class="times o item" id="*">x</button>
      <button class="divid o item" id="/">/</button>

      <button class="one n item" id="1">1</button>
      <button class="two n item" id="2">2</button>
      <button class="three n item" id="3">3</button>
      <button class="four n item" id="4">4</button>
      <button class="five n item" id="5">5</button>
      <button class="six n item" id="6">6</button>
      <button class="seven n item" id="7">7</button>
      <button class="eight n item" id="8">8</button>
      <button class="nine n item" id="9">9</button>
      <button class="zero n item" id="0">0</button>
    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="index.js"></script>
  </body>
</html>
